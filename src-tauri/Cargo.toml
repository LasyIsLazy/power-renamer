[package]
name = "power-renamer"
version = "1.0.0"
description = "文件重命名工具 - 支持自定义 JavaScript 重命名逻辑"
authors = ["you"]
license = ""
repository = "https://github.com/LasyIsLazy/power-renamer"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
rquickjs = "0.11.0"
md5 = "0.8"
digest = "0.11.1"
chrono = { version = "0.4.44", features = ["serde"] }
